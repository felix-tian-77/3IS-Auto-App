[project]
name = "threeis-auto-backend"
version = "0.1.0"
description = "3IS-Auto-App Backend (FastAPI)"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.49.0",
    "sqlalchemy==2.0.50",
    "greenlet==3.5.1",
    "asyncpg==0.31.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "python-multipart==0.0.32",
    "redis==8.0.0",
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",
    "alembic==1.18.4",
    "httpx==0.28.1",
    "aiofiles==25.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "aiosqlite>=0.22",
]

[tool.uv]
package = false
