[project]
name = "threeis-auto-worker"
version = "0.1.0"
description = "3IS-Auto-App Worker (Airtest RPA runtime)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "airtest==1.4.3",
    "pocoui==1.0.94",
    "requests==2.34.2",
    "pyyaml==6.0.3",
    "numpy==2.1.3",
    "opencv-contrib-python==4.10.0.84",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
]

[tool.uv]
package = false

# airtest 1.4.3 pins opencv-contrib-python<=4.6.0.66 (numpy 1.x ABI), which
# crashes on Python 3.13/3.14. Override to the numpy 2.x-compatible build.
# Runtime verified OK: airtest only uses basic cv2 APIs.
override-dependencies = [
    "opencv-contrib-python==4.10.0.84",
    "numpy==2.1.3",
]

[tool.pytest.ini_options]
# Isolate worker tests from the root pytest.ini (which has asyncio_mode=auto).
# The worker has no async tests in the MVP; add async ones here if needed later.
testpaths = ["tests"]
addopts = "-ra --strict-markers"
